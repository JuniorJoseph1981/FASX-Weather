name: Deploy Cloudflare Worker

# Deploys automatically whenever a merge to main changes the Worker (or its tests), and can also be run
# by hand from the Actions tab. The tests run first, so a broken Worker never goes live.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cloudflare-worker/**", "package.json", "tests/**"]

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare credentials are configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Verify the Cloudflare token and account ID
        run: |
          set -uo pipefail
          # Pasted secrets often carry a trailing space or line break. Strip them (masked, never printed)
          # and use the cleaned values for every later step.
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          account=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          CLOUDFLARE_API_TOKEN="$token"; CLOUDFLARE_ACCOUNT_ID="$account"
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID should be exactly 32 letters/numbers (found ${#CLOUDFLARE_ACCOUNT_ID} characters). Copy 'Account ID' from Workers & Pages."; exit 1
          fi
          echo "token length: ${#CLOUDFLARE_API_TOKEN} characters"
          # Cloudflare tokens are letters, numbers, - and _ (older ones 40 characters, newer ones with a cfut_/cfat_
          # prefix are longer). A pasted curl command or sentence contains other characters / is much longer.
          if ! printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -Eq '^[A-Za-z0-9_-]{30,80}$'; then
            echo "::error::CLOUDFLARE_API_TOKEN does not look like a Cloudflare token (found ${#CLOUDFLARE_API_TOKEN} characters). Common mistakes: copying the token NAME, a curl command, or the word 'Bearer'. Roll the token in Cloudflare, copy only the new value, and update the secret."; exit 1
          fi
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          user=$(curl -sS -o /dev/null -w '%{http_code}' -H "$auth" https://api.cloudflare.com/client/v4/user/tokens/verify)
          acct=$(curl -sS -o /dev/null -w '%{http_code}' -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify")
          echo "token check: user-token endpoint=$user, account-token endpoint=$acct"
          if [ "$user" != "200" ] && [ "$acct" != "200" ]; then
            echo "::error::Cloudflare does not accept CLOUDFLARE_API_TOKEN (it is invalid, expired, or was copied incompletely). Create a new token and re-add the secret."; exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "$auth" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=1")
          if [ "$code" != "200" ]; then
            echo "::error::Token is valid but cannot list Workers KV for this account (HTTP $code). Check CLOUDFLARE_ACCOUNT_ID is the right account and the token has Account > Workers KV Storage > Edit."; exit 1
          fi
          echo "Cloudflare credentials OK"

      - name: Run tests
        run: npm test

      - name: Find or create the KV namespace for the private contract data
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          id=$(curl -fsS -H "$auth" "${api}?per_page=100" | jq -r '.result[] | select(.title=="fasx-contract") | .id' | head -n1)
          if [ -z "$id" ]; then
            id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" -d '{"title":"fasx-contract"}' "$api" | jq -r '.result.id')
          fi
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::Could not get a KV namespace id"; exit 1; }
          sed -i "s/__KV_NAMESPACE_ID__/${id}/" cloudflare-worker/wrangler.toml
          echo "KV namespace ready"

      - name: Deploy Worker
        working-directory: cloudflare-worker
        run: npx --yes wrangler@4.159.0 deploy

      - name: Smoke test
        run: |
          sleep 5
          curl -fsS "https://fasx-log.${{ vars.CLOUDFLARE_SUBDOMAIN || 'vmcaviation2025' }}.workers.dev/health" | tee health.json
          jq -e '.ok == true and .storage == true' health.json
